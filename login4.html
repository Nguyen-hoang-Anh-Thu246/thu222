   <form>

        <tr>
            <td>
                <input type="radio" id="nam" name="gender" checked> <label for="nam">Nam</label>
                
            </td>
        </tr>
        <td><input type="radio" id="nu" name="gender"> <label for="nu">Nữ</label></td>
        <tr>
    
            <td>
                <input type="checkbox" id="remember"> <label for="remember">Lưu giá trị đăng nhập</label>
            </td>
        </tr>

       <tr>
    <td colspan="2">
        <button type="submit" style="background-color: #00a86b; color: white; border: none; padding: 8px 15px; cursor: pointer;">Đăng nhập</button>
