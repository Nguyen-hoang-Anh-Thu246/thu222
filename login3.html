<!DOCTYPE html>
<html>
    <head>

    <body bgcolor="#f4f4f4">
        <form name="dangky" action="" method="post">

            </tr>

                </td>
            </tr>

            <tr>
                <td>
                    <font face="Arial" size="3">Email:</font>
                </td>

                    <input type="text" name="txtEmail" size="30">

            </tr>

            <tr>
                <td>
                    <font face="Arial" size="3">Ảnh đại diện</font>

            </tr>

            <tr>
                <td>
                    <font face="Arial" size="3">Sở trường</font>
                </td>

            </tr>

              </tbody>
              
              <ul>
